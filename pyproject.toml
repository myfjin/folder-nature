[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-nature"
version = "0.1.0"
description = "Semantic identity for filesystem folders — folders become conversation partners"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Illia Hladkyi"},
]
requires-python = ">=3.10"
keywords = [
    "filesystem",
    "metadata",
    "semantic",
    "organization",
    "self-hosted",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
folder-nature = "folder_nature.cli:main"

[project.urls]
Homepage = "https://github.com/myfjin/folder-nature"
Repository = "https://github.com/myfjin/folder-nature"
Issues = "https://github.com/myfjin/folder-nature/issues"

[tool.setuptools]
packages = ["folder_nature"]
include-package-data = true

[tool.setuptools.package-data]
folder_nature = ["templates/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
